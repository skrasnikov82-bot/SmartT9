name: Build and publish SmartT9 APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SmartT9.apk
          cd release
          sha256sum SmartT9.apk > SmartT9.sha256
      - name: Publish downloadable APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 release/SmartT9.apk release/SmartT9.sha256 --clobber
          else
            gh release create v0.2.0 release/SmartT9.apk release/SmartT9.sha256 --title "SmartT9 v0.2.0" --notes "Test keyboard for Android: Russian and English layouts, offline corrections, optional explicitly triggered AI correction. Select the SmartT9 keyboard in Android settings after installing."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartT9-APK
          path: release/SmartT9.apk
          retention-days: 7
